<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>擲骰工具</title>

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="擲骰工具">
    <meta name="theme-color" content="#f0f2f5">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="擲骰工具">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        body {
            font-family: 'Segoe UI', "Microsoft JhengHei", Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
            min-height: 100vh;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .container {
            background-color: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .section {
            margin-bottom: 25px;
            text-align: center;
        }

        .section-title {
            font-size: 1em;
            font-weight: bold;
            margin-bottom: 15px;
            color: #7f8c8d;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .dice-types {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .dice-btn {
            background-color: #f8f9fa;
            border: 2px solid #dee2e6;
            padding: 10px 18px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: bold;
            color: #495057;
        }

        .dice-btn:hover {
            background-color: #e9ecef;
            border-color: #adb5bd;
        }

        .dice-btn.selected {
            background-color: #4a90e2;
            color: white;
            border-color: #357abd;
            box-shadow: 0 4px 10px rgba(74, 144, 226, 0.3);
        }

        .dice-btn[data-type="coin"].selected {
            background-color: #f1c40f;
            border-color: #f39c12;
            color: #2c3e50;
        }

        .qty-control {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            font-weight: bold;
        }

        input[type="number"] {
            width: 80px;
            padding: 10px;
            font-size: 18px;
            border: 2px solid #dee2e6;
            border-radius: 10px;
            text-align: center;
            outline: none;
            transition: border-color 0.2s;
        }
        
        input[type="number"]:focus {
            border-color: #4a90e2;
        }

        /* 10面骰說明文字樣式 */
        #d10-instruction {
            height: 24px;
            margin-bottom: 8px;
            font-size: 14px;
            color: #e67e22;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
        }

        #d10-instruction.visible {
            opacity: 1;
        }

        .results-area {
            flex-grow: 1;
            min-height: 250px;
            padding: 20px;
            background-color: #fbfbfb;
            border-radius: 12px;
            border: 3px dashed #bdc3c7;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .results-area:hover {
            background-color: #f0f4f8;
            border-color: #4a90e2;
        }

        .dice-results {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            width: 100%;
            pointer-events: none;
        }

        .die {
            width: 65px;
            height: 65px;
            background-color: #34495e;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 26px;
            font-weight: bold;
            border-radius: 14px;
            box-shadow: 0 5px 10px rgba(0,0,0,0.2);
            transition: background-color 0.1s;
        }

        .die.rolling {
            animation: rollingFlicker 0.1s infinite linear;
            background-color: #7f8c8d;
            filter: blur(1px);
        }

        .die.coin-style {
            background-color: #f39c12;
            border-radius: 50%;
            color: #fff;
            border: 3px solid #d35400;
        }

        .total-score {
            margin-top: 20px;
            font-size: 1.6em;
            font-weight: bold;
            color: #e74c3c;
            height: 1.6em;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .total-score.show {
            opacity: 1;
        }

        @keyframes rollingFlicker {
            0% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.05) rotate(5deg); }
            100% { transform: scale(1) rotate(0deg); }
        }
    </style>
</head>
<body>

    <h1>擲骰 / 投幣工具</h1>

    <div class="container">
        <div class="section">
            <div class="section-title">選擇類型</div>
            <div class="dice-types" id="dice-types">
                <button class="dice-btn selected" data-sides="6" data-type="dice">6 面</button>
                <button class="dice-btn" data-sides="4" data-type="dice">4 面</button>
                <button class="dice-btn" data-sides="8" data-type="dice">8 面</button>
                <button class="dice-btn" data-sides="10" data-type="dice">10 面</button>
                <button class="dice-btn" data-sides="12" data-type="dice">12 面</button>
                <button class="dice-btn" data-sides="20" data-type="dice">20 面</button>
                <button class="dice-btn" data-sides="2" data-type="coin">銅板</button>
            </div>
        </div>

        <div class="section">
            <div class="qty-control">
                <label for="dice-qty">數量 (1-10):</label>
                <input type="number" id="dice-qty" min="1" max="10" value="1">
            </div>
        </div>

        <div id="d10-instruction">十面骰的骰面數字為0~9</div>

        <div class="results-area" id="roll-trigger" title="點擊此處擲骰">
            <div class="dice-results" id="dice-results">
                <span style="color: #888; font-size: 1.2em; font-weight: bold;">點擊此區域開始擲骰</span>
            </div>
            <div class="total-score" id="total-score"></div>
        </div>
    </div>

    <script>
        let currentSides = 6;
        let currentType = 'dice';
        let isRolling = false;
        let lastValidQty = 1;

        const diceButtons = document.querySelectorAll('.dice-btn');
        const qtyInput = document.getElementById('dice-qty');
        const rollTrigger = document.getElementById('roll-trigger');
        const resultsContainer = document.getElementById('dice-results');
        const totalScoreDisplay = document.getElementById('total-score');
        const d10Instruction = document.getElementById('d10-instruction');

        const ANIM_MIN_TOTAL_MS = 500;
        const ANIM_MAX_TOTAL_MS = 1000;
        const FLICKER_INTERVAL_MS = 50;

        diceButtons.forEach(button => {
            button.addEventListener('click', (e) => {
                if (isRolling) return;
                diceButtons.forEach(btn => btn.classList.remove('selected'));
                e.target.classList.add('selected');
                
                currentSides = parseInt(e.target.getAttribute('data-sides'));
                currentType = e.target.getAttribute('data-type');

                // 控制說明文字顯示
                if (currentSides === 10 && currentType === 'dice') {
                    d10Instruction.classList.add('visible');
                } else {
                    d10Instruction.classList.remove('visible');
                }
            });
        });

        qtyInput.addEventListener('focus', (e) => {
            if (isRolling) { e.target.blur(); return; }
            e.target.value = '';
        });

        qtyInput.addEventListener('blur', (e) => {
            let val = parseInt(e.target.value);
            if (isNaN(val) || val < 1 || val > 10) {
                e.target.value = lastValidQty;
            } else {
                lastValidQty = val;
            }
        });

        rollTrigger.addEventListener('click', () => {
            if (isRolling) return;
            isRolling = true;
            
            qtyInput.blur(); 
            qtyInput.disabled = true;

            let qty = lastValidQty;
            resultsContainer.innerHTML = '';
            totalScoreDisplay.classList.remove('show');
            
            let finalResults = [];
            let diceElements = [];
            let flickerIntervals = [];
            let currentTotal = 0;

            for (let i = 0; i < qty; i++) {
                const dieElement = document.createElement('div');
                dieElement.classList.add('die');
                dieElement.classList.add('rolling');
                if (currentType === 'coin') dieElement.classList.add('coin-style');
                
                resultsContainer.appendChild(dieElement);
                diceElements.push(dieElement);

                let finalVal = 0;
                let finalText = '';

                if (currentType === 'coin') {
                    finalVal = Math.random() < 0.5 ? 1 : 0;
                    finalText = finalVal ? '正' : '反';
                } else {
                    // 核心修改：若是10面骰，結果為 0~9
                    if (currentSides === 10) {
                        finalVal = Math.floor(Math.random() * 10);
                    } else {
                        finalVal = Math.floor(Math.random() * currentSides) + 1;
                    }
                    finalText = finalVal;
                    currentTotal += finalVal;
                }
                finalResults.push({ val: finalVal, text: finalText });

                const interval = setInterval(() => {
                    if (currentType === 'coin') {
                        dieElement.textContent = Math.random() < 0.5 ? '正' : '反';
                    } else {
                        // 閃爍動畫也要符合 0~9 邏輯
                        if (currentSides === 10) {
                            dieElement.textContent = Math.floor(Math.random() * 10);
                        } else {
                            dieElement.textContent = Math.floor(Math.random() * currentSides) + 1;
                        }
                    }
                }, FLICKER_INTERVAL_MS);
                flickerIntervals.push(interval);
            }

            const stopDelay = ANIM_MIN_TOTAL_MS + Math.random() * (ANIM_MAX_TOTAL_MS - ANIM_MIN_TOTAL_MS);

            setTimeout(() => {
                for (let i = 0; i < qty; i++) {
                    clearInterval(flickerIntervals[i]);
                    diceElements[i].textContent = finalResults[i].text;
                    diceElements[i].classList.remove('rolling');
                }

                if (currentType === 'dice') {
                    totalScoreDisplay.textContent = `總和：${currentTotal}`;
                    totalScoreDisplay.classList.add('show');
                }
                
                isRolling = false;
                qtyInput.disabled = false;
            }, stopDelay);
        });
    </script>
</body>
</html>
