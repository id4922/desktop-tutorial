<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>懸念擲骰/投幣工具</title>
    <style>
        body {
            font-family: 'Segoe UI', "Microsoft JhengHei", Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
            min-height: 100vh;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .container {
            background-color: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
            display: flex;
            flex-direction: column;
            flex-grow: 1; /* 讓容器可以伸展 */
        }

        .section {
            margin-bottom: 25px;
            text-align: center;
        }

        .section-title {
            font-size: 1em;
            font-weight: bold;
            margin-bottom: 15px;
            color: #7f8c8d;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .dice-types {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .dice-btn {
            background-color: #f8f9fa;
            border: 2px solid #dee2e6;
            padding: 10px 18px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: bold;
            color: #495057;
        }

        .dice-btn:hover {
            background-color: #e9ecef;
            border-color: #adb5bd;
        }

        .dice-btn.selected {
            background-color: #4a90e2;
            color: white;
            border-color: #357abd;
            box-shadow: 0 4px 10px rgba(74, 144, 226, 0.3);
        }

        .dice-btn[data-type="coin"].selected {
            background-color: #f1c40f;
            border-color: #f39c12;
            color: #2c3e50;
        }

        .qty-control {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            font-weight: bold;
        }

        input[type="number"] {
            width: 80px;
            padding: 10px;
            font-size: 18px;
            border: 2px solid #dee2e6;
            border-radius: 10px;
            text-align: center;
            outline: none;
        }

        .results-area {
            flex-grow: 1; /* 讓結果區佔滿剩餘空間 */
            min-height: 180px;
            padding: 20px;
            background-color: #fbfbfb;
            border-radius: 12px;
            border: 2px dashed #eee;
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .dice-results {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            width: 100%;
        }

        /* 骰子基本樣式與定格動畫 */
        .die {
            width: 65px;
            height: 65px;
            background-color: #34495e;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 26px;
            font-weight: bold;
            border-radius: 14px;
            box-shadow: 0 5px 10px rgba(0,0,0,0.2);
            opacity: 1;
            transition: background-color 0.1s;
        }

        /* 跑動閃爍中的樣式 */
        .die.rolling {
            animation: rollingFlicker 0.1s infinite linear;
            background-color: #7f8c8d; /* 滾動時顏色變淺 */
            filter: blur(1px); /* 增加模糊感 */
        }

        /* 銅板基本樣式 */
        .die.coin-style {
            background-color: #f39c12;
            border-radius: 50%;
            color: #fff;
            border: 3px solid #d35400;
        }

        /* 銅板跑動樣式 */
        .die.coin-style.rolling {
            background-color: #f39c12;
            animation: coinRollingFlicker 0.1s infinite linear;
        }

        .total-score {
            margin-top: 20px;
            font-size: 1.6em;
            font-weight: bold;
            color: #e74c3c;
            height: 1.6em;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .total-score.show {
            opacity: 1;
        }

        #roll-btn {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 20px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 6px 15px rgba(46, 204, 113, 0.4);
            width: 100%;
            margin-top: auto; /* 推到最下面 */
        }

        #roll-btn:hover:not(:disabled) {
            background-color: #27ae60;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(46, 204, 113, 0.5);
        }

        #roll-btn:active:not(:disabled) {
            transform: translateY(1px);
        }

        #roll-btn:disabled {
            background-color: #a8e6cf;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* 骰子跑動閃爍動畫 */
        @keyframes rollingFlicker {
            0% { transform: scale(1) rotate(0deg); filter: blur(1px); }
            50% { transform: scale(1.05) rotate(5deg); filter: blur(1.5px); }
            100% { transform: scale(1) rotate(0deg); filter: blur(1px); }
        }

        /* 銅板跑動閃爍動畫（快速翻轉感） */
        @keyframes coinRollingFlicker {
            0% { transform: scaleX(1) rotate(0deg); }
            50% { transform: scaleX(0.1) rotate(180deg); }
            100% { transform: scaleX(1) rotate(360deg); }
        }
    </style>
</head>
<body>

    <h1>懸念擲骰 / 投幣工具</h1>

    <div class="container">
        <div class="section">
            <div class="section-title">選擇類型</div>
            <div class="dice-types" id="dice-types">
                <button class="dice-btn selected" data-sides="6" data-type="dice">6 面</button>
                <button class="dice-btn" data-sides="4" data-type="dice">4 面</button>
                <button class="dice-btn" data-sides="8" data-type="dice">8 面</button>
                <button class="dice-btn" data-sides="10" data-type="dice">10 面</button>
                <button class="dice-btn" data-sides="20" data-type="dice">20 面</button>
                <button class="dice-btn" data-sides="2" data-type="coin">銅板</button>
            </div>
        </div>

        <div class="section">
            <div class="qty-control">
                <label for="dice-qty">數量 (1-10):</label>
                <input type="number" id="dice-qty" min="1" max="10" value="1">
            </div>
        </div>

        <div class="results-area">
            <div class="dice-results" id="dice-results">
                <span style="color: #aaa;">點擊下方按鈕開始產生懸念</span>
            </div>
            <div class="total-score" id="total-score"></div>
        </div>

        <button id="roll-btn">擲骰 / 投幣！</button>
    </div>

    <script>
        let currentSides = 6;
        let currentType = 'dice';
        let isRolling = false; // 用於鎖定按鈕

        const diceButtons = document.querySelectorAll('.dice-btn');
        const qtyInput = document.getElementById('dice-qty');
        const rollBtn = document.getElementById('roll-btn');
        const resultsContainer = document.getElementById('dice-results');
        const totalScoreDisplay = document.getElementById('total-score');

        // 定義動畫時間範圍 (毫秒)
        const ANIM_MIN_TOTAL_MS = 500;
        const ANIM_MAX_TOTAL_MS = 1000;
        const FLICKER_INTERVAL_MS = 50; // 跑動時數字切換頻率

        // 類型切換邏輯
        diceButtons.forEach(button => {
            button.addEventListener('click', (e) => {
                if (isRolling) return; // 跑動中不可切換
                diceButtons.forEach(btn => btn.classList.remove('selected'));
                e.target.classList.add('selected');
                
                currentSides = parseInt(e.target.getAttribute('data-sides'));
                currentType = e.target.getAttribute('data-type');
            });
        });

        // 數量輸入檢查
        qtyInput.addEventListener('change', (e) => {
            if (isRolling) { // 跑動中強制寫回原值
                e.target.value = e.target.getAttribute('data-last-val') || 1;
                return;
            }
            let val = parseInt(e.target.value);
            if (isNaN(val) || val < 1) val = 1;
            if (val > 10) val = 10;
            e.target.value = val;
            e.target.setAttribute('data-last-val', val); // 記錄有效值
        });

        // 擲骰動作
        rollBtn.addEventListener('click', () => {
            if (isRolling) return;
            isRolling = true;
            rollBtn.disabled = true; // 禁用按鈕
            qtyInput.disabled = true; // 禁用數量輸入

            let qty = parseInt(qtyInput.value) || 1;
            if (qty > 10) qty = 10;

            resultsContainer.innerHTML = '';
            totalScoreDisplay.classList.remove('show');
            
            let finalResults = [];
            let diceElements = [];
            let flickerIntervals = [];

            // 1. 初始化所有骰子元素，全部進入 'rolling' 狀態
            for (let i = 0; i < qty; i++) {
                const dieElement = document.createElement('div');
                dieElement.classList.add('die');
                dieElement.classList.add('rolling'); // 加入跑動動畫
                if (currentType === 'coin') dieElement.classList.add('coin-style');
                
                resultsContainer.appendChild(dieElement);
                diceElements.push(dieElement);

                // 計算最終結果並儲存
                let finalVal = 0;
                let finalText = '';
                if (currentType === 'coin') {
                    finalVal = Math.random() < 0.5; // 用布林值存
                    finalText = finalVal ? '正' : '反';
                } else {
                    finalVal = Math.floor(Math.random() * currentSides) + 1;
                    finalText = finalVal;
                }
                finalResults.push({ val: finalVal, text: finalText });

                // 啟動快速閃爍亂數的 Interval
                const interval = setInterval(() => {
                    if (currentType === 'coin') {
                        dieElement.textContent = Math.random() < 0.5 ? '正' : '反';
                    } else {
                        dieElement.textContent = Math.floor(Math.random() * currentSides) + 1;
                    }
                }, FLICKER_INTERVAL_MS);
                flickerIntervals.push(interval);
            }

            // 2. 計算逐一確定的時間點
            // 確保最後一顆骰子在 0.5s 到 1s 之間停止
            const totalDuration = ANIM_MIN_TOTAL_MS + Math.random() * (ANIM_MAX_TOTAL_MS - ANIM_MIN_TOTAL_MS);
            // 每一顆骰子停止的時間間隔
            const stopInterval = qty > 1 ? totalDuration / (qty - 1) : 0;

            let currentTotal = 0;

            // 3. 依序設定定格排程
            for (let i = 0; i < qty; i++) {
                const stopDelay = qty > 1 ? i * stopInterval : ANIM_MIN_TOTAL_MS; // 只有一顆時，至少跑 0.5s

                setTimeout(() => {
                    // 停止該骰子的閃爍 Interval
                    clearInterval(flickerIntervals[i]);
                    
                    // 定格最終結果
                    const result = finalResults[i];
                    diceElements[i].textContent = result.text;
                    diceElements[i].classList.remove('rolling'); // 移除跑動動畫
                    
                    // 累加總合 (骰子才有)
                    if (currentType === 'dice') {
                        currentTotal += result.val;
                    }

                    // 如果是最後一顆，顯示總合並解鎖
                    if (i === qty - 1) {
                        setTimeout(() => {
                            if (currentType === 'dice') {
                                totalScoreDisplay.textContent = `總和：${currentTotal}`;
                                totalScoreDisplay.classList.add('show');
                            }
                            // 解鎖控制項
                            isRolling = false;
                            rollBtn.disabled = false;
                            qtyInput.disabled = false;
                        }, 100); // 稍微延遲顯示總和
                    }
                }, stopDelay);
            }
        });

        // 初始化記錄有效值
        qtyInput.setAttribute('data-last-val', qtyInput.value);
    </script>
</body>
</html>
