<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>太陽、地球、月球：天文與人文互動教學模型</title>
<style>
  :root {
    --bg-dark: #070b19;
    --panel-bg: rgba(16, 23, 42, 0.88);
    --border-color: rgba(100, 150, 255, 0.25);
    --accent: #38bdf8;
    --accent-gold: #fbbf24;
    --text-main: #f1f5f9;
    --text-muted: #94a3b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
    background-color: var(--bg-dark);
    color: var(--text-main);
    overflow: hidden;
    display: flex;
    height: 100vh;
    width: 100vw;
  }
  /* 左側畫布區 */
  #canvas-container {
    flex: 1;
    position: relative;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
    cursor: grab;
  }
  canvas:active { cursor: grabbing; }

  /* 頂部模式切換與輔助開關 */
  .top-bar {
    position: absolute;
    top: 16px;
    left: 16px;
    right: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    pointer-events: none;
    flex-wrap: wrap;
    gap: 10px;
  }
  .mode-tabs, .toggles-bar {
    pointer-events: auto;
    background: var(--panel-bg);
    border: 1px solid var(--border-color);
    border-radius: 10px;
    padding: 6px;
    display: flex;
    gap: 6px;
    backdrop-filter: blur(8px);
  }
  .btn {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid transparent;
    color: var(--text-main);
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.2s;
  }
  .btn:hover { background: rgba(255, 255, 255, 0.15); }
  .btn.active {
    background: rgba(56, 189, 248, 0.2);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 600;
  }
  .btn-gold.active {
    background: rgba(251, 191, 36, 0.2);
    border-color: var(--accent-gold);
    color: var(--accent-gold);
  }
  .scale-note {
    position: absolute;
    bottom: 135px;
    left: 18px;
    font-size: 12px;
    color: var(--text-muted);
    pointer-events: none;
    background: rgba(0,0,0,0.45);
    padding: 4px 8px;
    border-radius: 4px;
  }

  /* 底部控制列 */
  .bottom-controls {
    position: absolute;
    bottom: 16px;
    left: 16px;
    right: 16px;
    background: var(--panel-bg);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 14px 20px;
    backdrop-filter: blur(8px);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .control-row {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .slider-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 220px;
  }
  input[type="range"] {
    flex: 1;
    accent-color: var(--accent);
    cursor: pointer;
  }
  .preset-group {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  /* 右側知識解說面板 */
  #info-panel {
    width: 410px;
    background: var(--panel-bg);
    border-left: 1px solid var(--border-color);
    padding: 22px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
    z-index: 10;
  }
  .panel-header {
    border-bottom: 1px solid var(--border-color);
    padding-bottom: 12px;
  }
  .panel-tag {
    display: inline-block;
    font-size: 12px;
    color: var(--accent);
    background: rgba(56, 189, 248, 0.12);
    padding: 3px 8px;
    border-radius: 4px;
    margin-bottom: 6px;
  }
  .panel-title {
    font-size: 22px;
    font-weight: 700;
    color: var(--accent-gold);
  }
  .panel-subtitle {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 4px;
  }
  .metrics-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .metric-card {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 8px;
    padding: 10px 12px;
  }
  .metric-label { font-size: 12px; color: var(--text-muted); }
  .metric-value { font-size: 15px; font-weight: 600; margin-top: 4px; color: #fff; }
  
  .info-section {
    background: rgba(255, 255, 255, 0.03);
    border-left: 3px solid var(--accent);
    padding: 12px 14px;
    border-radius: 0 8px 8px 0;
  }
  .info-section.humanities {
    border-left-color: var(--accent-gold);
  }
  .info-section h3 {
    font-size: 15px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .info-section ul {
    padding-left: 18px;
    font-size: 13.5px;
    line-height: 1.65;
    color: #cbd5e1;
  }
  .info-section li { margin-bottom: 6px; }
  .highlight { color: var(--accent-gold); font-weight: 600; }

  @media (max-width: 960px) {
    body { flex-direction: column; overflow-y: auto; }
    #canvas-container { min-height: 60vh; }
    #info-panel { width: 100%; border-left: none; border-top: 1px solid var(--border-color); }
  }
</style>
</head>
<body>

<!-- 左側互動視覺區 -->
<div id="canvas-container">
  <canvas id="simCanvas"></canvas>

  <div class="top-bar">
    <div class="mode-tabs">
      <button class="btn active" id="tab-seasons" onclick="switchMode('seasons')">🌍 模式 A：四季與二分二至</button>
      <button class="btn" id="tab-eclipse" onclick="switchMode('eclipse')">🌑 模式 B：朔望月與日月蝕</button>
    </div>
    <div class="toggles-bar">
      <button class="btn active" id="toggle-lines" onclick="toggleOption('lines')">輔助軸線</button>
      <button class="btn active" id="toggle-rays" onclick="toggleOption('rays')">太陽光束/陰影</button>
      <button class="btn" id="toggle-view" onclick="toggleOption('topView')">切換俯視/斜視</button>
    </div>
  </div>

  <div class="scale-note">💡 註：為清楚呈現自轉軸傾角、晨昏線與本影錐，天體大小與距離採「教學示意比例」（非真實比例）。可拖曳畫面微調視角。</div>

  <!-- 模式 A 控制列 -->
  <div class="bottom-controls" id="controls-seasons">
    <div class="control-row">
      <button class="btn" id="play-btn" onclick="togglePlay()">⏸ 暫停公轉</button>
      <div class="slider-wrap">
        <span style="font-size:13px; color:var(--text-muted);">公轉進度：</span>
        <input type="range" id="day-slider" min="0" max="365" step="0.5" value="80" oninput="onDaySlider(this.value)">
        <span id="day-label" style="min-width:95px; font-size:14px; font-weight:600;">3月21日</span>
      </div>
      <div class="preset-group">
        <button class="btn btn-gold active" id="btn-spring" onclick="setSeason(0)">🌱 春分 (3/21)</button>
        <button class="btn btn-gold" id="btn-summer" onclick="setSeason(91.25)">☀️ 夏至 (6/21)</button>
        <button class="btn btn-gold" id="btn-autumn" onclick="setSeason(182.5)">🍂 秋分 (9/23)</button>
        <button class="btn btn-gold" id="btn-winter" onclick="setSeason(273.75)">❄️ 冬至 (12/22)</button>
      </div>
    </div>
  </div>

  <!-- 模式 B 控制列 -->
  <div class="bottom-controls" id="controls-eclipse" style="display:none;">
    <div class="control-row">
      <span style="font-size:13px; color:var(--text-muted);">選擇蝕象與朔望情境：</span>
      <div class="preset-group">
        <button class="btn btn-gold active" id="ecl-total-solar" onclick="setEclipse('total_solar')">🌑 日全蝕</button>
        <button class="btn btn-gold" id="ecl-annular-solar" onclick="setEclipse('annular_solar')">💍 日環蝕</button>
        <button class="btn btn-gold" id="ecl-partial-solar" onclick="setEclipse('partial_solar')">🌗 日偏蝕</button>
        <button class="btn btn-gold" id="ecl-total-lunar" onclick="setEclipse('total_lunar')">🌕 月全蝕 (血月)</button>
        <button class="btn btn-gold" id="ecl-partial-lunar" onclick="setEclipse('partial_lunar')">🌖 月偏蝕</button>
        <button class="btn btn-gold" id="ecl-none" onclick="setEclipse('normal_syzygy')">✨ 一般朔望 (未交食)</button>
      </div>
    </div>
    <div class="control-row">
      <div class="slider-wrap">
        <span style="font-size:13px; color:var(--text-muted);">微調月球通過陰影進度：</span>
        <input type="range" id="eclipse-phase-slider" min="-100" max="100" value="0" oninput="onEclipseSlider(this.value)">
        <button class="btn" onclick="resetEclipseSlider()">置中對齊 (食甚)</button>
      </div>
    </div>
  </div>
</div>

<!-- 右側資訊解說區 -->
<aside id="info-panel">
  <div class="panel-header">
    <span class="panel-tag" id="info-tag">二十四節氣・二分二至</span>
    <div class="panel-title" id="info-title">春分 (Vernal Equinox)</div>
    <div class="panel-subtitle" id="info-subtitle">約每年 3 月 20 日或 3 月 21 日</div>
  </div>

  <div class="metrics-grid">
    <div class="metric-card">
      <div class="metric-label" id="m1-label">太陽直射緯度</div>
      <div class="metric-value" id="m1-val">赤道 (0.0°)</div>
    </div>
    <div class="metric-card">
      <div class="metric-label" id="m2-label">北半球晝夜狀態</div>
      <div class="metric-value" id="m2-val">全球晝夜等長 (各12h)</div>
    </div>
    <div class="metric-card">
      <div class="metric-label" id="m3-label">台灣正午太陽仰角</div>
      <div class="metric-value" id="m3-val">約 66.5° (以北回歸線計)</div>
    </div>
    <div class="metric-card">
      <div class="metric-label" id="m4-label">北極圈內現象</div>
      <div class="metric-value" id="m4-val">晨昏線通過極點</div>
    </div>
  </div>

  <div class="info-section">
    <h3>🔭 天文物理機制</h3>
    <ul id="astro-list"></ul>
  </div>

  <div class="info-section humanities">
    <h3>🏛️ 人文歷史與民俗事件</h3>
    <ul id="human-list"></ul>
  </div>
</aside>

<script>
const canvas = document.getElementById('simCanvas');
const ctx = canvas.getContext('2d');

// 狀態管理
let state = {
  mode: 'seasons', // 'seasons' | 'eclipse'
  playing: true,
  dayOfYear: 0, // 0 = 春分 (3/21), 91.25 = 夏至, 182.5 = 秋分, 273.75 = 冬至
  showLines: true,
  showRays: true,
  topView: false,
  tiltPitch: 0.42, // 軌道橢圓俯仰比
  eclipseType: 'total_solar',
  eclipseOffset: 0, // -100 ~ 100 微調進度
  stars: []
};

// 初始化背景星空
for (let i = 0; i < 160; i++) {
  state.stars.push({
    x: Math.random(),
    y: Math.random(),
    r: Math.random() * 1.5 + 0.4,
    alpha: Math.random() * 0.6 + 0.2
  });
}

// 資料庫：四季與二分二至
const seasonData = {
  spring: {
    tag: '二十四節氣・二分二至',
    title: '春分 (Vernal Equinox)',
    subtitle: '約每年 3 月 20 日 ～ 3 月 21 日',
    astro: [
      '地球公轉至地軸與日地連線垂直的位置，<span class="highlight">太陽直射赤道 (0°)</span>。',
      '晨昏線正好通過南北極點，全球各地<span class="highlight">晝夜等長</span>（白晝與黑夜各 12 小時）。',
      '春分過後，太陽直射點開始移向北半球，北半球白晝逐漸長於黑夜。'
    ],
    human: [
      '<span class="highlight">朝日祭典</span>：古代帝王遵循「春分朝日，秋分夕月」禮制，於春分前往東郊日壇祭祀太陽。',
      '<span class="highlight">春分立蛋</span>：民間流傳在春分這天立蛋最容易成功，象徵天地陰陽平衡與萬物復甦的生機。',
      '<span class="highlight">曆法基準</span>：波斯新年（Nowruz）以春分為歲首；西方基督教「復活節」則定於春分月圓後的第一個星期日。'
    ]
  },
  summer: {
    tag: '二十四節氣・二分二至',
    title: '夏至 (Summer Solstice)',
    subtitle: '約每年 6 月 21 日 ～ 6 月 22 日',
    astro: [
      '地軸北端傾向太陽達最大角度，<span class="highlight">太陽直射北回歸線 (23.5°N)</span>（通過台灣嘉義水上、花蓮瑞穗）。',
      '北半球迎来全年<span class="highlight">白晝最長、黑夜最短</span>的一天；北回歸線地區正午出現「立竿不見影」。',
      '北極圈（66.5°N 以北）全境進入<span class="highlight">永晝（極晝）</span>，南極圈則進入永夜。'
    ],
    human: [
      '<span class="highlight">祭地與收麥</span>：古人於夏至「祭地祇」感念土地滋養；民俗云「冬至湯圓夏至麵」，此時新麥登場，民間盛行吃涼麵消暑。',
      '<span class="highlight">巨石陣天文對準</span>：英國史前遺跡巨石陣（Stonehenge）的主軸線，精準對準夏至清晨日出的方向。',
      '<span class="highlight">台灣北回歸線標</span>：嘉義水上設有三代北回歸線標誌，是全球最早設立北回歸線紀念碑的地點之一。'
    ]
  },
  autumn: {
    tag: '二十四節氣・二分二至',
    title: '秋分 (Autumnal Equinox)',
    subtitle: '約每年 9 月 22 日 ～ 9 月 23 日',
    astro: [
      '太陽直射點由北向南再次回到<span class="highlight">赤道 (0°)</span>，晨昏線再次通過南北極點。',
      '全球迎來一年中第二次<span class="highlight">晝夜等長</span>。',
      '秋分過後，太陽直射點進入南半球，北半球開始晝短夜長，北極點開始進入長達半年的極夜。'
    ],
    human: [
      '<span class="highlight">夕月與中秋節淵源</span>：古帝王於秋分祭月（夕月於西郊）。因秋分在農曆八月日期不固定、未必有圓月，唐宋後將祭月賞月習俗固定於農曆八月十五中秋節。',

  },

    tag: '二十四節氣・二分二至',

      '地軸北端背離太陽達最大角度，<span class="highlight">太陽直射南回歸線 (23.5°S)</span>。',

    ],
    human: [
      '<span class="highlight">冬至大如年</span>：《易經》稱「冬至一陽生」，古人視冬至為陽光與生機重返的起點，周代更以冬至所在之月為歲首（正月）。',
      '<span class="highlight">圭表測影與祭天</span>：古代天文官利用「圭表」測量冬至最長正午日影以定回歸年長度；帝王則於北京天壇舉行最隆重的冬至祭天大典。',
      '<span class="highlight">吃湯圓與農神節</span>：台灣與江南吃湯圓象徵「添歲」團圓，北方則吃水餃；古羅馬農神節（Saturnalia）與耶誕節期亦源於冬至慶祝光明回歸。'
    ]
  }
};

// 資料庫：日月蝕模式
const eclipseData = {
  total_solar: {
    tag: '朔望與交食・農曆初一 (朔)',
    title: '日全蝕 (Total Solar Eclipse)',
    subtitle: '排列：太陽 － 月球 － 地球（落入本影錐）',
    m1: ['發生農曆日期', '初一 (朔 New Moon)'],
    m2: ['黃白交點條件', '月球位於交點附近 (約0°偏移)'],
    m3: ['地月距離狀態', '近地點附近 (視直徑 ≥ 太陽)'],
    m4: ['地表可見範圍', '狹長本影帶 (寬約 100~250km)'],
    astro: [
      '月球運行至太陽與地球之間，且正好通過<span class="highlight">黃白交點</span>，三者精準連成一直線。',
      '月球距離地球較近，視直徑略大於太陽，月球的<span class="highlight">本影錐（Umbra）</span>尖端觸及地表。',
      '位於本影帶內的觀測者會看見太陽被完全遮蔽，白晝瞬間變暗，並露出平時無法肉眼看見的銀白色<span class="highlight">日冕（Corona）</span>、日珥與倍里珠（Baily\'s beads）。'
    ],
    human: [
      '<span class="highlight">《尚書》仲康日食與救日</span>：古人視日蝕為君王失德的天譴警示，《尚書·胤征》記載夏代天文官羲和因沉迷飲酒漏報日食而獲罪；民間則稱「天狗食日」，會擊鼓鳴鑼以救日。',
      '<span class="highlight">愛丁頓驗證廣義相對論 (1919)</span>：英國天文學家愛丁頓趁日全蝕遮蔽強光時，拍攝太陽邊緣的背景恆星，證實星光受太陽重力場偏折，成為愛因斯坦廣義相對論最著名的實驗鐵證。'
    ]
  },
  annular_solar: {
    tag: '朔望與交食・農曆初一 (朔)',
    title: '日環蝕 (Annular Solar Eclipse)',
    subtitle: '排列：太陽 － 月球 － 地球（落入偽本影區）',
    m1: ['發生農曆日期', '初一 (朔 New Moon)'],
    m2: ['黃白交點條件', '月球位於交點附近 (約0°偏移)'],
    m3: ['地月距離狀態', '遠地點附近 (視直徑 < 太陽)'],
    m4: ['關鍵光影區域', '偽本影區 (Antumbra)'],
    astro: [
      '由於月球繞地軌道為橢圓形，當月球位於<span class="highlight">遠地點</span>附近發生日蝕時，月球的視直徑小於太陽。',
      '月球的本影錐在半空中交會結束，未能觸及地球表面；地表觀測者落入本影錐延伸出去的<span class="highlight">偽本影區（Antumbra）</span>。',
      '月球僅能遮住太陽中心大部分區域，邊緣露出一圈耀眼的<span class="highlight">「金環（Ring of Fire）」</span>。'
    ],

// 視窗尺寸自適應
function resizeCanvas() {
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width * window.devicePixelRatio;
  canvas.height = rect.height * window.devicePixelRatio;
  ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// 滑鼠拖曳改變俯仰視角
let isDragging = false, lastY = 0;
canvas.addEventListener('mousedown', e => { isDragging = true; lastY = e.clientY; });
window.addEventListener('mouseup', () => { isDragging = false; });
window.addEventListener('mousemove', e => {
  if (!isDragging || state.mode !== 'seasons') return;
  const dy = e.clientY - lastY;
  lastY = e.clientY;
  state.tiltPitch = Math.max(0.2, Math.min(0.95, state.tiltPitch + dy * 0.003));
  state.topView = state.tiltPitch > 0.85;
});

// 模式與按鈕切換邏輯
function switchMode(mode) {
  state.mode = mode;
  document.getElementById('tab-seasons').classList.toggle('active', mode === 'seasons');
  document.getElementById('tab-eclipse').classList.toggle('active', mode === 'eclipse');
  document.getElementById('controls-seasons').style.display = mode === 'seasons' ? 'flex' : 'none';
  document.getElementById('controls-eclipse').style.display = mode === 'eclipse' ? 'flex' : 'none';
  document.getElementById('toggle-view').style.display = mode === 'seasons' ? 'inline-block' : 'none';
  
  if (mode === 'seasons') {
    updateSeasonInfo();
  } else {
    updateEclipseInfo();
  }
}
