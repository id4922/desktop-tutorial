<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>單手 ARPG - 支援長按與連點</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #121212; touch-action: none; font-family: sans-serif; }
    #canvas { display: block; width: 100%; height: 100%; }
    #ui {
      position: absolute; top: 12px; left: 12px; right: 12px;
      display: flex; justify-content: space-between; align-items: flex-start;
      pointer-events: none; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }
    .info { font-size: 13px; line-height: 1.6; }
    .switch-btn {
      pointer-events: auto; background: #e67e22; color: #fff; border: none;
      padding: 10px 16px; border-radius: 6px; font-weight: bold; cursor: pointer;
    }
    .switch-btn:active { background: #d35400; }
  </style>
</head>
<body>

  <div id="ui">
    <div class="info">
      <div>當前職業：<strong id="roleName" style="color: #f39c12; font-size: 15px;">野蠻人</strong></div>
      <div id="roleHint" style="color: #bbb;"></div>
    </div>
    <button class="switch-btn" id="switchBtn">切換職業</button>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // ==========================================
    // 1. 全功能單手觸控解析器 (支援 Tap, DoubleTap, Hold, Drag, Flick)
    // ==========================================
    class GestureInput {
      constructor(domElement, onAction) {
        this.dom = domElement;
        this.onAction = onAction;

        this.touchId = null;
        this.startX = 0;
        this.startY = 0;
        this.startTime = 0;
        this.isDragging = false;
        this.isHolding = false;
        this.holdTimer = null;

        // 連點記錄
        this.lastTapTime = 0;
        this.lastTapX = 0;
        this.lastTapY = 0;

        // 參數閥值
        this.DEADZONE = 12;
        this.HOLD_DELAY = 380;       // 按住多久算長按
        this.DOUBLE_TAP_DELAY = 280; // 連點間隔時間 (ms)
        this.FLICK_TIME = 220;
        this.FLICK_DIST = 40;

        this.init();
      }

      init() {
        this.dom.addEventListener('pointerdown', (e) => this.onDown(e));
        this.dom.addEventListener('pointermove', (e) => this.onMove(e));
        this.dom.addEventListener('pointerup', (e) => this.onUp(e));
        this.dom.addEventListener('pointercancel', (e) => this.onUp(e));
      }

      onDown(e) {
        if (this.touchId !== null) return;
        this.touchId = e.pointerId;
        this.startX = e.clientX;
        this.startY = e.clientY;
        this.startTime = performance.now();
        this.isDragging = false;
        this.isHolding = false;

        // 啟動長按檢測
        this.holdTimer = setTimeout(() => {
          if (!this.isDragging) {
            this.isHolding = true;
            this.onAction('HOLD_START', { x: this.startX, y: this.startY });
          }
        }, this.HOLD_DELAY);
      }

      onMove(e) {
        if (e.pointerId !== this.touchId) return;

        const dx = e.clientX - this.startX;
        const dy = e.clientY - this.startY;
        const dist = Math.hypot(dx, dy);

        // 如果已經在長按中，可以當作蓄力轉向
        if (this.isHolding) {
          this.onAction('HOLD_AIM', { dx, dy, dirX: dx / (dist || 1), dirY: dy / (dist || 1) });
          return;
        }

        if (dist > this.DEADZONE) {
          clearTimeout(this.holdTimer);
          this.isDragging = true;
          this.onAction('DRAG', {
            dx, dy, dist,
            dirX: dx / dist,
            dirY: dy / dist
          });
        }
      }

      onUp(e) {
        if (e.pointerId !== this.touchId) return;
        clearTimeout(this.holdTimer);

        const now = performance.now();
        const duration = now - this.startTime;
        const dx = e.clientX - this.startX;
        const dy = e.clientY - this.startY;
        const dist = Math.hypot(dx, dy);

        if (this.isHolding) {
          // 長按釋放
          this.onAction('HOLD_RELEASE', { duration });
        } else if (duration < this.FLICK_TIME && dist > this.FLICK_DIST) {
          // 快速輕彈
          this.onAction('FLICK', { dirX: dx / dist, dirY: dy / dist });
        } else if (dist <= this.DEADZONE) {
          // 點擊判定（判斷是單擊還是雙擊）
          const timeSinceLastTap = now - this.lastTapTime;
          const distFromLastTap = Math.hypot(e.clientX - this.lastTapX, e.clientY - this.lastTapY);

          if (timeSinceLastTap < this.DOUBLE_TAP_DELAY && distFromLastTap < 40) {
            this.onAction('DOUBLE_TAP', { x: e.clientX, y: e.clientY });
            this.lastTapTime = 0; // 重置避免連三次觸發兩次
          } else {
            this.lastTapTime = now;
            this.lastTapX = e.clientX;
            this.lastTapY = e.clientY;
            this.onAction('TAP', { x: e.clientX, y: e.clientY });
          }
        } else {
          this.onAction('RELEASE', {});
        }

        this.touchId = null;
        this.isDragging = false;
        this.isHolding = false;
      }
    }

    // ==========================================
    // 2. 特效與彈道系統
    // ==========================================
    const particles = [];
    function addParticle(p) { particles.push(p); }

    class Shockwave {
      constructor(x, y, maxR, color, lineWidth = 3) {
        this.x = x; this.y = y; this.maxR = maxR; this.r = 10;
        this.color = color; this.lineWidth = lineWidth; this.alive = true;
      }
      update() {
        this.r += (this.maxR - this.r) * 0.18;
        if (this.maxR - this.r < 1.5) this.alive = false;
      }
      render(ctx) {
        ctx.save();
        ctx.strokeStyle = this.color;
        ctx.lineWidth = this.lineWidth;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
    }

    class Projectile {
      constructor(x, y, dx, dy, speed, size, color, life = 40) {
        this.x = x; this.y = y;
        this.vx = dx * speed; this.vy = dy * speed;
        this.size = size; this.color = color;
        this.life = life; this.alive = true;
      }
      update() {
        this.x += this.vx; this.y += this.vy;
        if (--this.life <= 0) this.alive = false;
      }
      render(ctx) {
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // ==========================================
    // 3. 角色行為策略（支援長按與連點）
    // ==========================================
    class BaseRoleStrategy {
      constructor(hero) { this.hero = hero; }
      onAction(type, data) {}
      update(dt) {}
      render(ctx) {}
    }

    // --- 角色 A：狂戰士（旋風、戰吼蓄力、雙擊連劈） ---
    class BarbarianStrategy extends BaseRoleStrategy {
      constructor(hero) {
        super(hero);
        this.spinAngle = 0;
        this.isSpinning = false;
        this.chargeTimer = 0;
        this.isCharging = false;
      }

      onAction(type, data) {
        if (this.hero.isDashing) return;

        if (type === 'DRAG') {
          this.isSpinning = true;
          this.hero.vx = data.dirX * 3.5;
          this.hero.vy = data.dirY * 3.5;
        } else if (type === 'RELEASE') {
          this.hero.vx = 0;
          this.hero.vy = 0;
          if (this.isSpinning) {
            this.isSpinning = false;
            addParticle(new Shockwave(this.hero.x, this.hero.y, 60, '#e67e22'));
          }
        } else if (type === 'FLICK') {
          // 輕彈：躍擊
          this.isSpinning = false;
          this.hero.dash(data.dirX, data.dirY, 16, 0.88, () => {
            addParticle(new Shockwave(this.hero.x, this.hero.y, 75, '#f39c12', 4));
          });
        } else if (type === 'TAP') {
          // 單擊：原地重揮一刀
          addParticle(new Shockwave(this.hero.x, this.hero.y, 45, '#c0392b', 2));
        } else if (type === 'DOUBLE_TAP') {
          // 連點：裂地猛擊（大範圍二段爆發）
          addParticle(new Shockwave(this.hero.x, this.hero.y, 110, '#e74c3c', 5));
        } else if (type === 'HOLD_START') {
          // 長按：開始戰吼蓄力
          this.hero.vx = 0;
          this.hero.vy = 0;
          this.isSpinning = false;
          this.isCharging = true;
          this.chargeTimer = 0;
        } else if (type === 'HOLD_RELEASE') {
          // 長按釋放：依蓄力時間爆發怒氣戰吼
          this.isCharging = false;
          const powerRadius = Math.min(180, 50 + this.chargeTimer * 0.15);
          addParticle(new Shockwave(this.hero.x, this.hero.y, powerRadius, '#ff0055', 6));
          this.chargeTimer = 0;
        }
      }

      update(dt) {
        if (this.isCharging) {
          this.chargeTimer += dt;
        }
        if (this.isSpinning && !this.hero.isDashing) {
          this.spinAngle += 0.35;
        }
      }

      render(ctx) {
        ctx.fillStyle = '#c0392b';
        ctx.beginPath();
        ctx.arc(this.hero.x, this.hero.y, this.hero.isDashing ? 23 : 19, 0, Math.PI * 2);
        ctx.fill();

        // 旋風斬刀光
        if (this.isSpinning && !this.hero.isDashing) {
          ctx.strokeStyle = '#f39c12';
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.arc(this.hero.x, this.hero.y, 42, this.spinAngle, this.spinAngle + Math.PI * 1.3);
          ctx.stroke();
        }

        // 蓄力聚能效果
        if (this.isCharging) {
          ctx.strokeStyle = 'rgba(255, 0, 85, 0.7)';
          ctx.lineWidth = 3;
          const pulse = (Math.sin(performance.now() * 0.02) + 1) * 8;
          ctx.beginPath();
          ctx.arc(this.hero.x, this.hero.y, 30 + pulse, 0, Math.PI * 2);
          ctx.stroke();
        }
      }
    }

    // --- 角色 B：獵人（走位、速射連點、穿透重矢長按） ---
    class HunterStrategy extends BaseRoleStrategy {
      constructor(hero) {
        super(hero);
        this.isMoving = false;
        this.isAiming = false;
        this.aimAngle = 0;
      }

      onAction(type, data) {
        if (this.hero.isDashing) return;

        if (type === 'DRAG') {
          this.isMoving = true;
          this.hero.vx = data.dirX * 4.5;
          this.hero.vy = data.dirY * 4.5;
        } else if (type === 'RELEASE') {
          this.isMoving = false;
          this.hero.vx = 0;
          this.hero.vy = 0;
        } else if (type === 'FLICK') {
          // 輕彈：翻滾
          this.isMoving = false;
          this.hero.dash(data.dirX, data.dirY, 18, 0.86);
        } else if (type === 'TAP') {
          // 單擊：朝正前方扇形速射 3 發箭
          const baseAng = -Math.PI / 2;
          [-0.2, 0, 0.2].forEach(off => {
            addParticle(new Projectile(this.hero.x, this.hero.y, Math.cos(baseAng + off), Math.sin(baseAng + off), 9, 3, '#2ecc71'));
          });
        } else if (type === 'DOUBLE_TAP') {
          // 連點：後跳步 + 散射陷阱彈
          this.hero.dash(0, 1, 14, 0.85); // 往下/後方後撤
          for (let a = 0; a < Math.PI * 2; a += Math.PI / 4) {
            addParticle(new Projectile(this.hero.x, this.hero.y, Math.cos(a), Math.sin(a), 7, 3.5, '#3498db'));
          }
        } else if (type === 'HOLD_START') {
          // 長按：進入狙擊瞄準
          this.hero.vx = 0;
          this.hero.vy = 0;
          this.isMoving = false;
          this.isAiming = true;
          this.aimAngle = -Math.PI / 2; // 預設朝上
        } else if (type === 'HOLD_AIM') {
          this.aimAngle = Math.atan2(data.dy, data.dx);
        } else if (type === 'HOLD_RELEASE') {
          // 長按釋放：射出穿透重矢
          this.isAiming = false;
          addParticle(new Projectile(this.hero.x, this.hero.y, Math.cos(this.aimAngle), Math.sin(this.aimAngle), 16, 7, '#f1c40f', 60));
          addParticle(new Shockwave(this.hero.x, this.hero.y, 40, '#f1c40f'));
        }
      }

      update(dt) {}

      render(ctx) {
        ctx.fillStyle = '#27ae60';
        ctx.beginPath();
        ctx.arc(this.hero.x, this.hero.y, 18, 0, Math.PI * 2);
        ctx.fill();

        // 瞄準輔助線
        if (this.isAiming) {
          ctx.strokeStyle = 'rgba(241, 196, 15, 0.7)';
          ctx.lineWidth = 2;
          ctx.setLineDash([6, 4]);
          ctx.beginPath();
          ctx.moveTo(this.hero.x, this.hero.y);
          ctx.lineTo(this.hero.x + Math.cos(this.aimAngle) * 140, this.hero.y + Math.sin(this.aimAngle) * 140);
          ctx.stroke();
          ctx.setLineDash([]);
        }
      }
    }

    // ==========================================
    // 4. 主角實體 (Hero)
    // ==========================================
    class Hero {
      constructor(x, y) {
        this.x = x; this.y = y;
        this.vx = 0; this.vy = 0;
        this.strategy = null;
        this.isDashing = false;
        this.dashDecel = 0.88;
        this.onDashEnd = null;
      }

      setStrategy(strategy) {
        this.strategy = strategy;
        this.vx = 0; this.vy = 0;
        this.isDashing = false;
      }

      handleAction(type, data) {
        if (this.strategy) this.strategy.onAction(type, data);
      }

      dash(dirX, dirY, speed, decel = 0.88, onEnd = null) {
        this.isDashing = true;
        this.dashDecel = decel;
        this.onDashEnd = onEnd;
        this.vx = dirX * speed;
        this.vy = dirY * speed;
      }

      update(dt) {
        if (this.isDashing) {
          this.vx *= this.dashDecel;
          this.vy *= this.dashDecel;
          if (Math.hypot(this.vx, this.vy) < 0.4) {
            this.vx = 0; this.vy = 0;
            this.isDashing = false;
            if (this.onDashEnd) {
              this.onDashEnd();
              this.onDashEnd = null;
            }
          }
        }

        this.x += this.vx;
        this.y += this.vy;
        this.x = Math.max(20, Math.min(canvas.width - 20, this.x));
        this.y = Math.max(20, Math.min(canvas.height - 20, this.y));

        if (this.strategy) this.strategy.update(dt);
      }

      render(ctx) {
        if (this.strategy) this.strategy.render(ctx);
      }
    }

    // ==========================================
    // 5. 初始化與執行
    // ==========================================
    const hero = new Hero(canvas.width / 2, canvas.height / 2);

    const roles = [
      {
        name: '野蠻人',
        hint: '拖曳:旋風斬 | 輕彈:躍擊 | 單擊:揮砍 | 雙擊:裂地猛擊 | 長按:戰吼蓄力',
        create: (h) => new BarbarianStrategy(h)
      },
      {
        name: '獵人',
        hint: '拖曳:走位 | 輕彈:翻滾 | 單擊:扇形速射 | 雙擊:後跳散射 | 長按:瞄準穿透狙擊',
        create: (h) => new HunterStrategy(h)
      }
    ];

    let currentRoleIdx = 0;
    function applyRole(idx) {
      currentRoleIdx = idx;
      hero.setStrategy(roles[idx].create(hero));
      document.getElementById('roleName').innerText = roles[idx].name;
      document.getElementById('roleHint').innerText = roles[idx].hint;
    }
    applyRole(0);

    document.getElementById('switchBtn').addEventListener('click', () => {
      applyRole((currentRoleIdx + 1) % roles.length);
    });

    new GestureInput(canvas, (actionType, data) => {
      hero.handleAction(actionType, data);
    });

    let lastTime = performance.now();
    function loop(now) {
      const dt = now - lastTime;
      lastTime = now;

      hero.update(dt);
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        if (!particles[i].alive) particles.splice(i, 1);
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 背景地圖網格
      ctx.strokeStyle = '#1e1e1e';
      ctx.lineWidth = 1;
      const gridSize = 40;
      for (let x = 0; x < canvas.width; x += gridSize) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += gridSize) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }

      particles.forEach(p => p.render(ctx));
      hero.render(ctx);

      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
