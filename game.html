<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>單手 ARPG 角色行為抽換原型</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #121212; touch-action: none; font-family: sans-serif; }
    #canvas { display: block; width: 100%; height: 100%; }
    #ui {
      position: absolute; top: 12px; left: 12px; right: 12px;
      display: flex; justify-content: space-between; align-items: flex-start;
      pointer-events: none; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }
    .info { font-size: 14px; line-height: 1.5; }
    .switch-btn {
      pointer-events: auto; background: #e67e22; color: #fff; border: none;
      padding: 10px 16px; border-radius: 6px; font-weight: bold; cursor: pointer;
    }
    .switch-btn:active { background: #d35400; }
  </style>
</head>
<body>

  <div id="ui">
    <div class="info">
      <div>當前職業：<strong id="roleName">野蠻人</strong></div>
      <div id="roleHint" style="font-size: 12px; color: #ccc;">拖曳: 旋風斬 | 放手: 撼地震擊 | 輕彈(Flick): 躍擊</div>
    </div>
    <button class="switch-btn" id="switchBtn">切換職業</button>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // ==========================================
    // 1. 單手觸控手勢解析器 (Input Adapter)
    // ==========================================
    class GestureInput {
      constructor(domElement, onAction) {
        this.dom = domElement;
        this.onAction = onAction;

        this.touchId = null;
        this.startX = 0;
        this.startY = 0;
        this.startTime = 0;
        this.currentX = 0;
        this.currentY = 0;
        this.isDragging = false;
        this.holdTimer = null;

        this.DEADZONE = 10;
        this.FLICK_TIME = 250;
        this.FLICK_DIST = 40;
        this.HOLD_TIME = 450;

        this.init();
      }

      init() {
        this.dom.addEventListener('pointerdown', (e) => this.onPointerDown(e));
        this.dom.addEventListener('pointermove', (e) => this.onPointerMove(e));
        this.dom.addEventListener('pointerup', (e) => this.onPointerUp(e));
        this.dom.addEventListener('pointercancel', (e) => this.onPointerUp(e));
      }

      onPointerDown(e) {
        if (this.touchId !== null) return;
        this.touchId = e.pointerId;
        this.startX = e.clientX;
        this.startY = e.clientY;
        this.currentX = e.clientX;
        this.currentY = e.clientY;
        this.startTime = performance.now();
        this.isDragging = false;

        this.holdTimer = setTimeout(() => {
          if (!this.isDragging) {
            this.onAction('HOLD', { x: this.startX, y: this.startY });
          }
        }, this.HOLD_TIME);
      }

      onPointerMove(e) {
        if (e.pointerId !== this.touchId) return;
        this.currentX = e.clientX;
        this.currentY = e.clientY;

        const dx = this.currentX - this.startX;
        const dy = this.currentY - this.startY;
        const dist = Math.hypot(dx, dy);

        if (dist > this.DEADZONE) {
          clearTimeout(this.holdTimer);
          this.isDragging = true;
          this.onAction('DRAG', {
            dx: dx,
            dy: dy,
            dist: dist,
            dirX: dx / dist,
            dirY: dy / dist
          });
        }
      }

      onPointerUp(e) {
        if (e.pointerId !== this.touchId) return;
        clearTimeout(this.holdTimer);

        const duration = performance.now() - this.startTime;
        const dx = e.clientX - this.startX;
        const dy = e.clientY - this.startY;
        const dist = Math.hypot(dx, dy);

        if (duration < this.FLICK_TIME && dist > this.FLICK_DIST) {
          this.onAction('FLICK', { dirX: dx / dist, dirY: dy / dist });
        } else if (dist <= this.DEADZONE && duration < this.HOLD_TIME) {
          this.onAction('TAP', { x: e.clientX, y: e.clientY });
        } else {
          this.onAction('RELEASE', {});
        }

        this.touchId = null;
        this.isDragging = false;
      }
    }

    // ==========================================
    // 2. 特效與彈道容器
    // ==========================================
    const particles = [];
    function addParticle(p) { particles.push(p); }

    // ==========================================
    // 3. 角色行為策略（Strategy）
    // ==========================================
    class BaseRoleStrategy {
      constructor(hero) { this.hero = hero; }
      onAction(type, data) {}
      update(dt) {}
      render(ctx) {}
    }

    // --- 角色 A：旋風狂戰士 ---
    class BarbarianStrategy extends BaseRoleStrategy {
      constructor(hero) {
        super(hero);
        this.spinAngle = 0;
        this.isSpinning = false;
        this.rage = 0;
      }

      onAction(type, data) {
        if (type === 'DRAG') {
          this.isSpinning = true;
          this.hero.vx = data.dirX * 3.5;
          this.hero.vy = data.dirY * 3.5;
          this.rage = Math.min(100, this.rage + 0.3);
        } else if (type === 'RELEASE') {
          this.hero.vx = 0;
          this.hero.vy = 0;
          if (this.isSpinning) {
            this.isSpinning = false;
            // 放手釋放撼地衝擊
            addParticle(new Shockwave(this.hero.x, this.hero.y, 80 + this.rage * 0.5, '#e67e22'));
            this.rage = 0;
          }
        } else if (type === 'FLICK') {
          // 快速輕彈：跳斬 (躍進一段距離)
          this.hero.x += data.dirX * 120;
          this.hero.y += data.dirY * 120;
          addParticle(new Shockwave(this.hero.x, this.hero.y, 60, '#f39c12'));
        }
      }

      update(dt) {
        if (this.isSpinning) {
          this.spinAngle += 0.3;
          if (Math.random() < 0.3) {
            addParticle(new Spark(this.hero.x, this.hero.y, '#e74c3c'));
          }
        }
      }

      render(ctx) {
        ctx.fillStyle = '#c0392b';
        ctx.beginPath();
        ctx.arc(this.hero.x, this.hero.y, 20, 0, Math.PI * 2);
        ctx.fill();

        if (this.isSpinning) {
          ctx.strokeStyle = '#f39c12';
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.arc(this.hero.x, this.hero.y, 45, this.spinAngle, this.spinAngle + Math.PI * 1.2);
          ctx.stroke();
        }
      }
    }

    // --- 角色 B：獵人/遊俠 ---
    class HunterStrategy extends BaseRoleStrategy {
      constructor(hero) {
        super(hero);
        this.shootTimer = 0;
        this.isMoving = false;
      }

      onAction(type, data) {
        if (type === 'DRAG') {
          this.isMoving = true;
          this.hero.vx = data.dirX * 4.5;
          this.hero.vy = data.dirY * 4.5;
        } else if (type === 'RELEASE') {
          this.isMoving = false;
          this.hero.vx = 0;
          this.hero.vy = 0;
        } else if (type === 'FLICK') {
          // 快速輕彈：翻滾 + 原地留下緩速陷阱
          addParticle(new Trap(this.hero.x, this.hero.y));
          this.hero.x += data.dirX * 100;
          this.hero.y += data.dirY * 100;
        }
      }

      update(dt) {
        // 站樁自動射擊
        if (!this.isMoving) {
          this.shootTimer += dt;
          if (this.shootTimer > 180) { // 射擊間隔
            this.shootTimer = 0;
            // 朝四周散射箭矢
            for (let a = 0; a < Math.PI * 2; a += Math.PI / 2) {
              addParticle(new Arrow(this.hero.x, this.hero.y, Math.cos(a), Math.sin(a)));
            }
          }
        } else {
          this.shootTimer = 0;
        }
      }

      render(ctx) {
        ctx.fillStyle = '#27ae60';
        ctx.beginPath();
        ctx.arc(this.hero.x, this.hero.y, 18, 0, Math.PI * 2);
        ctx.fill();

        // 站樁蓄勢提示圈
        if (!this.isMoving) {
          ctx.strokeStyle = 'rgba(46, 204, 113, 0.4)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(this.hero.x, this.hero.y, 30, 0, Math.PI * 2);
          ctx.stroke();
        }
      }
    }

    // ==========================================
    // 4. 特效物件實作
    // ==========================================
    class Shockwave {
      constructor(x, y, maxR, color) {
        this.x = x; this.y = y; this.maxR = maxR; this.r = 10;
        this.color = color; this.alive = true;
      }
      update() {
        this.r += (this.maxR - this.r) * 0.2;
        if (this.maxR - this.r < 2) this.alive = false;
      }
      render(ctx) {
        ctx.save();
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
    }

    class Arrow {
      constructor(x, y, dx, dy) {
        this.x = x; this.y = y; this.dx = dx * 8; this.dy = dy * 8;
        this.life = 40; this.alive = true;
      }
      update() {
        this.x += this.dx;
        this.y += this.dy;
        if (--this.life <= 0) this.alive = false;
      }
      render(ctx) {
        ctx.fillStyle = '#2ecc71';
        ctx.beginPath();
        ctx.arc(this.x, this.y, 4, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    class Trap {
      constructor(x, y) {
        this.x = x; this.y = y; this.life = 120; this.alive = true;
      }
      update() {
        if (--this.life <= 0) this.alive = false;
      }
      render(ctx) {
        ctx.strokeStyle = '#3498db';
        ctx.strokeRect(this.x - 8, this.y - 8, 16, 16);
      }
    }

    class Spark {
      constructor(x, y, color) {
        this.x = x + (Math.random() - 0.5) * 30;
        this.y = y + (Math.random() - 0.5) * 30;
        this.life = 15; this.alive = true; this.color = color;
      }
      update() { if (--this.life <= 0) this.alive = false; }
      render(ctx) {
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, 3, 3);
      }
    }

    // ==========================================
    // 5. 主角實體 (Hero Entity)
    // ==========================================
    class Hero {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.vx = 0;
        this.vy = 0;
        this.strategy = null;
      }

      setStrategy(strategy) {
        this.strategy = strategy;
      }

      handleAction(type, data) {
        if (this.strategy) this.strategy.onAction(type, data);
      }

      update(dt) {
        this.x += this.vx;
        this.y += this.vy;
        // 邊界限制
        this.x = Math.max(20, Math.min(canvas.width - 20, this.x));
        this.y = Math.max(20, Math.min(canvas.height - 20, this.y));

        if (this.strategy) this.strategy.update(dt);
      }

      render(ctx) {
        if (this.strategy) this.strategy.render(ctx);
      }
    }

    // ==========================================
    // 6. 初始化與主循環
    // ==========================================
    const hero = new Hero(canvas.width / 2, canvas.height / 2);

    const roles = [
      {
        name: '野蠻人',
        hint: '拖曳: 旋風斬 | 放手: 撼地震擊 | 輕彈(Flick): 躍擊',
        create: (h) => new BarbarianStrategy(h)
      },
      {
        name: '獵人',
        hint: '拖曳: 走位避戰 | 放手: 站樁連射 | 輕彈(Flick): 翻滾陷阱',
        create: (h) => new HunterStrategy(h)
      }
    ];

    let currentRoleIdx = 0;
    function applyRole(idx) {
      currentRoleIdx = idx;
      hero.setStrategy(roles[idx].create(hero));
      document.getElementById('roleName').innerText = roles[idx].name;
      document.getElementById('roleHint').innerText = roles[idx].hint;
    }
    applyRole(0);

    document.getElementById('switchBtn').addEventListener('click', () => {
      applyRole((currentRoleIdx + 1) % roles.length);
    });

    new GestureInput(canvas, (actionType, data) => {
      hero.handleAction(actionType, data);
    });

    let lastTime = performance.now();
    function loop(now) {
      const dt = now - lastTime;
      lastTime = now;

      // 邏輯更新
      hero.update(dt);
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        if (!particles[i].alive) particles.splice(i, 1);
      }

      // 畫面繪製
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      // 繪製格線背景
      ctx.strokeStyle = '#1e1e1e';
      ctx.lineWidth = 1;
      const gridSize = 40;
      for (let x = 0; x < canvas.width; x += gridSize) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += gridSize) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }

      // 繪製粒子與角色
      particles.forEach(p => p.render(ctx));
      hero.render(ctx);

      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
